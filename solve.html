<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quadratic Equation Solver</title>
</head>
<body>
    <script>
        // 1. 获取用户输入的系数a、b、c
        let a = parseFloat(prompt("请输入系数a（a>0）："));
        let b = parseFloat(prompt("请输入系数b："));
        let c = parseFloat(prompt("请输入系数c："));

        // 3. 计算判别式delta
        let delta = b * b - 4 * a * c;

        // 4. 计算两个根
        let x1 = (-b + Math.sqrt(delta)) / (2 * a);
        let x2 = (-b - Math.sqrt(delta)) / (2 * a);

        // 5. 用alert展示结果
        alert(`方程的两个根为：x1 = ${x1}，x2 = ${x2}`);

        // 6. 用console.log展示结果
        console.log(`方程的两个根为：x1 = ${x1}，x2 = ${x2}`);
    </script>
</body>
</html>
